[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe360"
version = "0.2.0"
description = "MCP server and CLI for reframing raw Insta360 dual-fisheye 360° video with 1000 Hz IMU horizon lock and DaVinci Resolve Fusion export"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "joshp123" }]
keywords = ["insta360", "360-video", "mcp", "davinci-resolve", "stabilization", "reframe"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
]

[project.urls]
Homepage = "https://github.com/joshp123/reframe360"
Repository = "https://github.com/joshp123/reframe360"

[project.scripts]
reframe360 = "reframe360.cli:main"
reframe360-mcp = "reframe360.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
